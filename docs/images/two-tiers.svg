<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="330" rx="16" fill="#ffffff"/>
  <!-- Core -->
  <rect x="40" y="36" width="420" height="258" rx="12" fill="#f6f6f6" stroke="#e4e4e4"/>
  <text x="64" y="72" font-size="19" font-weight="600" fill="#131313">Core requirements</text>
  <rect x="64" y="84" width="128" height="22" rx="11" fill="#131313"/><text x="128" y="99" font-size="12" text-anchor="middle" fill="#fff">Every task</text>
  <text x="204" y="100" font-size="13" fill="#6b6b6b">Scored by graders: code</text>
  <text x="204" y="117" font-size="13" fill="#6b6b6b">that measures the model</text>
  <g font-size="14" fill="#131313">
    <text x="92" y="156">No overlapping spaces</text>
    <text x="92" y="184">Storeys stack correctly</text>
    <text x="92" y="212">Every space can be reached</text>
    <text x="92" y="240">The brief's numbers are met</text>
    <text x="92" y="268">Elements are real building components</text>
  </g>
  <g fill="none" stroke="#1f9d55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M66 151l5 5 9-10"/><path d="M66 179l5 5 9-10"/><path d="M66 207l5 5 9-10"/><path d="M66 235l5 5 9-10"/><path d="M66 263l5 5 9-10"/>
  </g>
  <!-- Design -->
  <rect x="500" y="36" width="420" height="258" rx="12" fill="#e8effe" stroke="#9ab6fb"/>
  <text x="524" y="72" font-size="19" font-weight="600" fill="#131313">Design aspects</text>
  <rect x="524" y="84" width="172" height="22" rx="11" fill="#0a57fe"/><text x="610" y="99" font-size="12" text-anchor="middle" fill="#fff">Where the task needs it</text>
  <text x="708" y="100" font-size="12" fill="#4a5a7a">Scored by a review LLM</text>
  <text x="708" y="116" font-size="12" fill="#4a5a7a">built from architects' reviews</text>
  <g font-size="14" fill="#131313">
    <text x="524" y="156"><tspan font-weight="600">Space planning</tspan><tspan fill="#4a5a7a">  areas, adjacency, circulation</tspan></text>
    <text x="524" y="184"><tspan font-weight="600">BIM detailing</tspan><tspan fill="#4a5a7a">  walls, doors, windows</tspan></text>
  <rect x="796" y="168" width="116" height="22" rx="11" fill="#ffffff" stroke="#0a57fe"/><text x="854" y="183" font-size="11" text-anchor="middle" fill="#0a57fe">Doors and windows</text>
    <text x="524" y="212"><tspan font-weight="600">Drawings</tspan><tspan fill="#4a5a7a">  plans, sections, sheets</tspan></text>
    <text x="524" y="240"><tspan font-weight="600">Services</tspan><tspan fill="#4a5a7a">  plumbing, electrical, HVAC, fire</tspan></text>
    <text x="524" y="268"><tspan font-weight="600">Value engineering</tspan><tspan fill="#4a5a7a">  area and cost</tspan></text>
  </g>
  <rect x="512" y="166" width="4" height="26" rx="2" fill="#0a57fe"/>
</svg>
